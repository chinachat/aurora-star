<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#05130c"/>
    </linearGradient>
    <linearGradient id="aurora1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="30%" stop-color="#10b981" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aurora2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0"/>
      <stop offset="40%" stop-color="#a855f7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- 极光光带 -->
  <g filter="url(#blur)">
    <path d="M-100,600 C300,400 500,500 700,410 C900,320 1100,450 1300,360 C1450,300 1580,360 1700,310 L1700,900 L-100,900 Z" fill="url(#aurora1)" opacity="0.9"/>
    <path d="M-100,680 C200,540 450,640 700,540 C900,450 1150,580 1400,480 C1500,440 1600,480 1700,450 L1700,900 L-100,900 Z" fill="url(#aurora2)" opacity="0.8"/>
    <ellipse cx="350" cy="280" rx="400" ry="170" fill="#818cf8" opacity="0.28"/>
    <ellipse cx="1250" cy="240" rx="360" ry="140" fill="#34d399" opacity="0.22"/>
    <ellipse cx="900" cy="360" rx="520" ry="130" fill="#22d3ee" opacity="0.15"/>
  </g>

  <!-- 星光 -->
  <g fill="#ffffff">
    <circle cx="180" cy="120" r="1.4" opacity="0.7"/>
    <circle cx="420" cy="70" r="1" opacity="0.5"/>
    <circle cx="650" cy="150" r="1.2" opacity="0.6"/>
    <circle cx="900" cy="80" r="1.5" opacity="0.7"/>
    <circle cx="1120" cy="140" r="1" opacity="0.5"/>
    <circle cx="1350" cy="90" r="1.3" opacity="0.6"/>
    <circle cx="1520" cy="170" r="1" opacity="0.5"/>
    <circle cx="300" cy="200" r="0.9" opacity="0.4"/>
    <circle cx="760" cy="60" r="0.9" opacity="0.4"/>
    <circle cx="1440" cy="60" r="1" opacity="0.5"/>
  </g>
</svg>
